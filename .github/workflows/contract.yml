name: contract

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "engine/app/**"
      - "apps/**"
      - "tests-contract/**"
      - "ruff.toml"
      - ".github/workflows/contract.yml"
      - ".github/actions/ruff/action.yml"
  pull_request:
    paths:
      - "README.md"
      - "engine/app/**"
      - "apps/**"
      - "tests-contract/**"
      - "ruff.toml"
      - ".github/workflows/contract.yml"
      - ".github/actions/ruff/action.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

  RUFF_VERSION: "0.14.14"

jobs:

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: ./.github/actions/ruff
        with:
          version: ${{ env.RUFF_VERSION }}

  error-codes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install
        run: pip install pytest
      - name: Error-code vocabulary (contract §3.1)
        run: python -m pytest tests-contract -q
