name: engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "ruff.toml"
      - ".trivyignore"
      - ".github/workflows/engine.yml"
      - ".github/actions/models/action.yml"
  pull_request:
    paths:
      - "engine/**"
      - "ruff.toml"
      - ".trivyignore"
      - ".github/workflows/engine.yml"
      - ".github/actions/models/action.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

  RUFF_VERSION: "0.14.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: ./.github/actions/ruff
        with:
          version: ${{ env.RUFF_VERSION }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: engine
    env:

      FACETECH_REQUIRE_MODELS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install
        run: pip install -r requirements.txt pytest httpx
      - name: Models (restore, fetch, verify)
        uses: ./.github/actions/models
      - name: Assert node is available to the encoder tests
        run: node --version

      - name: Unit tests
        run: |
          set -o pipefail
          python -m pytest tests -q -rs | tee "$RUNNER_TEMP/pytest.log"
      - name: Assert nothing skipped
        run: |
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/pytest.log"; then
            echo "::error::tests skipped in a job that must not skip any - see the SKIPPED lines above"
            exit 1
          fi
          echo "no skips"

  image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Models (restore, fetch, verify)
        uses: ./.github/actions/models

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image (local)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: engine
          load: true
          push: false
          tags: facetech-engine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: facetech-engine:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore
          scanners: vuln

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: engine
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/facetech-engine:latest
            ghcr.io/${{ github.repository_owner }}/facetech-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    permissions: {}
    steps:

      - name: Deploy to VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          command_timeout: 15m
          script: |
            cd /opt/facetech
            ./deploy/deploy.sh
