<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmFatec: Developer and Security Console, Working Wireframe</title>
<link rel="stylesheet" href="/shared/fonts/fonts.css">
<style>
:root{--logo:url('/shared/logo.png')}
:root{
  --crimson:#BF202F; --crimson-hi:#D82C3C; --crimson-dim:rgba(191,32,47,.18);
  --paper:#0B0D0E; --panel:#181B1E; --panel2:#1E2226;
  --ink:#F0F1F0; --ink2:#A2A9AF; --ink3:#6C747B;
  --line:#2A2F34; --line2:#22262A; --fill:#1E2226; --fill2:#15181A;
  --warn:#D08B2C; --warnBg:rgba(208,139,44,.12); --warnLine:rgba(208,139,44,.42);
  --ok:#2E9E68;
  --hex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><g fill='none' stroke='%23BF202F' stroke-width='1'><path d='M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z'/><path d='M28 32.5 L56 48.5 L56 80.5 L28 96.5 L0 80.5 L0 48.5 Z'/></g></svg>");
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);font:400 14px/1.5 'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  color:var(--ink);overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background-image:var(--hex);opacity:.045;
  pointer-events:none;z-index:0}
h1,.h{font-family:'Archivo',sans-serif;letter-spacing:-.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

#app{height:100%;display:grid;grid-template-columns:230px 1fr;grid-template-rows:52px 1fr}
.top{grid-column:1/-1;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 20px;gap:12px;background:var(--fill2)}
.logo{width:22px;height:22px;flex:none;background-image:var(--logo);background-size:contain;
  background-position:center;background-repeat:no-repeat}
.top .title{font-family:'Archivo',sans-serif;font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.top .spacer{flex:1}
.pill{border:1px solid var(--line);padding:4px 10px;font-size:11px;font-family:'IBM Plex Mono',monospace;
  color:var(--ink2);background:var(--panel2);white-space:nowrap}
.pill.solid{background:var(--ok);color:#08120C;border-color:var(--ok);font-weight:600}
.pill.off{background:var(--fill);color:var(--ink3)}
.pill.warn{border-color:var(--warnLine);background:var(--warnBg);color:var(--warn)}

.nav{border-right:1px solid var(--line);padding:16px 0;background:var(--fill2);overflow-y:auto}
.nav .grp{font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink3);padding:0 20px 8px}
.nav button{display:block;width:100%;text-align:left;padding:9px 20px;font-size:13px;color:var(--ink2);
  background:none;border:0;border-left:3px solid transparent}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button.on{background:var(--panel);border-left-color:var(--crimson);color:var(--ink);font-weight:600}
.nav .sep{height:1px;background:var(--line2);margin:14px 20px}

.main{padding:24px 28px 260px;overflow-y:auto}
body.demohid .main{padding-bottom:80px}
.h{font-size:17px;font-weight:600;margin-bottom:4px}
.sh{font-size:12.5px;color:var(--ink2);margin-bottom:18px}

.row{display:flex;gap:16px}
.col{display:flex;flex-direction:column;gap:16px}
.card{border:1px solid var(--line);background:var(--panel);position:relative;z-index:1}
.card.warn{border-color:var(--warnLine)}
.card-h{padding:11px 16px;border-bottom:1px solid var(--line2);font-size:12.5px;font-weight:600;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h .spacer{flex:1}
.card-b{padding:16px}
.lbl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--ink3);margin-bottom:5px;letter-spacing:.1em}
.val{font-size:13px}
.val.big{font-family:'Archivo',sans-serif;font-size:26px;font-weight:600;letter-spacing:-.025em}
.val.mono{font-family:'IBM Plex Mono',monospace;font-size:12px}

.btn{display:inline-block;border:1px solid var(--line);padding:8px 14px;font-size:12.5px;background:var(--panel2);
  color:var(--ink);white-space:nowrap;border-radius:2px}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--crimson);border-color:var(--crimson);color:#fff;font-weight:500}
.btn.pri:hover{background:var(--crimson-hi);border-color:var(--crimson-hi)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.ghost{border-color:var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

input.field,select.field,textarea.field{width:100%;border:1px solid var(--line);background:var(--fill2);
  padding:9px 12px;font:inherit;font-size:12.5px;color:var(--ink);border-radius:0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;font-family:'IBM Plex Mono',monospace;color:var(--ink3);font-weight:400;
  padding:8px 12px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line2);color:var(--ink2);vertical-align:middle}
td.k{color:var(--ink)}
td.act{white-space:nowrap;text-align:right;padding-right:0}
tr.sel td{background:var(--panel2)}
tr.bad td{background:var(--warnBg)}

.blob{font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.75;color:var(--ink2);
  background:var(--fill2);border:1px solid var(--line2);padding:14px;overflow:auto;white-space:pre}
.seg{display:flex;border:1px solid var(--line);width:fit-content}
.seg button{padding:6px 14px;font-size:12px;border:0;border-right:1px solid var(--line);background:var(--panel2);color:var(--ink2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--crimson);color:#fff}

.bar{height:24px;background:var(--fill);border:1px solid var(--line);position:relative;overflow:hidden}
.bar span{position:absolute;left:0;top:0;bottom:0;background:var(--crimson);transition:width .3s ease}
.bar b{position:absolute;right:8px;top:3px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:500}
.bar.warn span{background:var(--warn)}
.bar.ok span{background:var(--ok)}
.bar.neutral span{background:var(--ink3)}

.step{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--ink2)}
.step:last-child{border-bottom:0}
.step .txt{flex:1}
.step .t2{font-size:11.5px;color:var(--ink3);margin-top:3px}
.step .ms{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink3)}
.dot{width:9px;height:9px;border:1.5px solid var(--ink3);border-radius:50%;flex:none;margin-top:4px}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.fail{background:var(--warn);border-color:var(--warn)}
.dot.skip{border-style:dashed;opacity:.5}

.note{padding:12px;background:var(--fill2);border:1px solid var(--line2);font-size:12px;color:var(--ink2);line-height:1.55}
.note.warn{background:var(--warnBg);border-color:var(--warnLine);color:var(--warn)}
.note.warn b{display:block;font-size:13px;margin-bottom:5px}

.view{background:var(--fill);border:1px solid var(--line);height:300px;position:relative;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.oval{width:150px;height:196px;border:2px dashed var(--line);border-radius:50%;
  display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:11.5px;
  text-align:center;padding:14px;transition:transform .3s ease}
.oval.live{border-style:solid;border-color:var(--ok);color:var(--ink)}
.oval.bad{border-color:var(--warn);color:var(--warn)}
.view .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:var(--panel);
  border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.view .badge{position:absolute;top:12px;left:12px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;
  background:var(--panel);border:1px solid var(--crimson-dim);padding:3px 8px;color:var(--crimson);letter-spacing:.12em}

.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:15px;height:20px;background:var(--fill);border:1px solid var(--line2);display:block}
.strip i.on{background:var(--crimson);border-color:var(--crimson)}
.strip i.bad{background:var(--warn);border-color:var(--warn)}

.gone{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
  text-align:center;gap:14px;padding:40px}
.gone .box{width:52px;height:52px;border:2px solid var(--ink3)}
.gone h2{font-size:19px;font-weight:600}
.gone p{color:var(--ink2);font-size:13.5px;max-width:46ch}

.scrim{position:fixed;inset:0;background:rgba(28,30,32,.42);display:flex;align-items:center;
  justify-content:center;z-index:60}
.modal{background:var(--panel);border:1px solid var(--crimson);width:470px;max-width:92vw}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line2);font-weight:600;font-size:15px}
.modal-b{padding:20px;font-size:13px;color:var(--ink2);line-height:1.6}
.modal-f{padding:14px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:10px}

#toast{position:fixed;left:20px;bottom:20px;z-index:70;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--ok);
  color:var(--ink);padding:10px 14px;font-size:12.5px;max-width:360px}
.toast.warn{border-left-color:var(--warn);color:var(--warn)}

#demo{position:fixed;right:0;bottom:0;z-index:50;width:310px;background:var(--panel);
  border-left:1px solid var(--line);border-top:1px solid var(--line)}
#demo h3{font-size:12px;font-family:'IBM Plex Mono',monospace;padding:11px 16px;
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
#demo h3 .spacer{flex:1}
#demo .body{padding:6px 16px 14px;max-height:54vh;overflow-y:auto}
#demo.min .body{display:none}
.tog{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);
  font-size:12.5px;color:var(--ink2)}
.tog:last-child{border-bottom:0}
.tog .spacer{flex:1}
.sw{width:34px;height:19px;border:1px solid var(--line);background:var(--fill2);position:relative;flex:none;padding:0}
.sw i{position:absolute;top:2px;left:2px;width:13px;height:13px;background:var(--ink3);transition:left .16s ease}
.sw.on{background:var(--crimson);border-color:var(--crimson)}
.sw.on i{left:17px;background:#fff}
#demo .hint{font-size:11px;color:var(--ink3);line-height:1.5;padding-top:10px}
</style>
</head>
<body>

<div id="app">
  <div style="background:#b3261e;color:#fff;font:600 12px/1.6 ui-monospace,Consolas,monospace;
    text-align:center;padding:6px 12px;letter-spacing:.5px">
    SIMULATED DATA &mdash; ENGINE WIRING IN S6 &nbsp;&middot;&nbsp; ALL NUMBERS ON THIS CONSOLE ARE FAKE
  </div>
  <div class="top">
    <div class="logo"></div><div class="title">AmFatec, developer and security console</div>
    <div class="spacer"></div><div id="topPills"></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div><div id="toast"></div>

<aside id="demo">
  <h3>Demo controls <span class="spacer"></span><button class="btn sm ghost" id="demoMin">Hide</button></h3>
  <div class="body" id="demoBody"></div>
</aside>

<script src="./capture.js"></script>
<script src="./console.js"></script>
<script type="module" src="./deps.js"></script>
<script src="/shared/boot-check.js" defer></script>
</body>
</html>
