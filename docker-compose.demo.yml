name: facetech-demo

networks:

  demo: {}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:

      - "127.0.0.1:${CADDY_HTTP_PORT:-8099}:80"
    networks: [demo]
    environment:
      API_DOMAIN: ${API_DOMAIN}

      DEMO_AUTH_HASH: ${DEMO_AUTH_HASH:?must be set in .env (caddy hash-password)}

    volumes:
      - ./Caddyfile.demo:/etc/caddy/Caddyfile:ro

      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    logging:

      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  gateway:
    build:

      context: .
      dockerfile: mock-gateway/Dockerfile
    image: facetech-mock-gateway:${FACETECH_BUILD_ID:-dev}
    restart: unless-stopped
    expose: ["8080"]
    networks: [demo]
    environment:
      FACETECH_ENGINE_URL: http://engine:8000

      ENGINE_API_KEY: ${ENGINE_API_KEY:?must be set in .env (see .env.example)}

      FACETECH_CAPTURE_DB: ${FACETECH_CAPTURE_DB:?must be set in .env (deploy doc §6)}
      FACETECH_EVALUATION_DAYS: ${FACETECH_EVALUATION_DAYS:-7}

    volumes:

      - ${FACETECH_CAPTURE_DIR:-/var/lib/facetech/captures}:/captures:rw
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.4
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/capture-status')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      engine:
        condition: service_healthy

  engine:
    image: ${ENGINE_IMAGE}
    build:

      context: ./engine
      args:

        FACETECH_BUILD_ID: ${FACETECH_BUILD_ID:?export it from git rev-parse --short HEAD (deploy doc step 2)}
    restart: unless-stopped
    expose: ["8000"]
    networks: [demo]
    environment:

      ENGINE_API_KEY: ${ENGINE_API_KEY:?must be set in .env (see .env.example)}
      FACETECH_DIAGNOSTIC_HEADER: "1"

    user: "10001:10001"
    read_only: true
    tmpfs:

      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    logging:

      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  caddy_data: {}
  caddy_config: {}
