name: facetech

networks:
  web: {}
  internal: {}

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [web]
    environment:

      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  gateway:

    image: ${CRYPTO_IMAGE}
    restart: unless-stopped
    environment:

      DATABASE_URL: postgres://facetech:${POSTGRES_PASSWORD}@postgres:5432/facetech
      ENGINE_URL: http://engine:8000

      ENGINE_API_KEY: ${ENGINE_API_KEY:?must be set in .env (see .env.example)}
    networks: [web, internal]
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy

  engine:
    image: ${ENGINE_IMAGE}
    restart: unless-stopped
    expose: ["8000"]
    networks: [internal]
    environment:

      ENGINE_API_KEY: ${ENGINE_API_KEY:?must be set in .env (see .env.example)}

    user: "10001:10001"
    read_only: true
    tmpfs:

      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    logging:

      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: facetech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: facetech
    networks: [internal]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facetech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
