<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Facetech test review</title><style>
body{font:16px/1.5 system-ui;margin:24px auto;padding:0 16px;max-width:1100px;color:#17202a;background:#f5f7fa}
button,a{cursor:pointer}button{padding:8px;margin:4px}article,section{background:white;padding:16px;margin:12px 0;border:1px solid #ccd5df;border-radius:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#frames{display:flex;gap:10px;flex-wrap:wrap}figure{margin:0;width:200px}img{width:100%;height:auto}figcaption{font-size:12px}small{display:block}
</style></head><body><h1>Facetech test review</h1>
<p>Private team evaluation. Labels describe the test; engine results are independent. Missing scores mean not computed or unavailable.</p>
<p><a href="/">Run a test</a> <button id="refresh">Refresh newest</button> <button id="older">Older attempts</button></p>
<p id="status" role="status"></p><div id="list"></div><section id="detail" hidden><h2>Attempt details</h2><button id="delete">Delete this capture and its scores</button><pre id="numbers"></pre><div id="frames"></div></section>
<script>
const el=id=>document.getElementById(id);let selected=null,before=null;
async function api(path,options){const r=await fetch('/review/api/'+path,{cache:'no-store',...options});if(!r.ok)throw Error('Request failed: '+r.status);return r.json()}
async function load(reset){try{if(reset)before=null;const data=await api('captures'+(before?'?before='+before:''));el('list').replaceChildren();el('status').textContent='Retention: '+data.retention_days+' days. Showing '+data.items.length+' attempts.';for(const item of data.items){const card=document.createElement('article'),button=document.createElement('button'),info=document.createElement('small');button.textContent=item.captured_at+' · '+(item.subject_id||'unlabelled')+' · '+item.endpoint+' · HTTP '+item.status_code;info.textContent=JSON.stringify({test:item.test_context,label:item.label,result:item.decision?.outcome,liveness:item.decision?.liveness?.score,failed:item.decision?.liveness?.failed,request:item.request_id});button.onclick=()=>show(item.id);card.append(button,info);el('list').append(card)}if(data.items.length)before=data.items.at(-1).id;el('older').disabled=data.items.length<50}catch(e){el('status').textContent=e.message}}
async function show(id){try{const item=await api('captures/'+id);selected=id;el('detail').hidden=false;el('numbers').textContent=JSON.stringify(item,null,2);el('frames').replaceChildren();for(const f of item.frames){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src='/review/api/captures/'+id+'/frames/'+f.index;image.alt='Captured frame '+(f.index+1);caption.textContent='Frame '+(f.index+1)+' · '+f.ts_ms+' ms';figure.append(image,caption);el('frames').append(figure)}el('detail').scrollIntoView({behavior:'smooth'})}catch(e){el('status').textContent=e.message}}
el('refresh').onclick=()=>load(true);el('older').onclick=()=>load(false);el('delete').onclick=async()=>{if(selected===null||!confirm('Permanently delete this capture and its stored diagnostics?'))return;try{await api('captures/'+selected,{method:'DELETE',headers:{'X-Review-Action':'delete'}});el('frames').replaceChildren();el('numbers').textContent='';el('detail').hidden=true;selected=null;await load(true)}catch(e){el('status').textContent=e.message}};load(true);
</script></body></html>
